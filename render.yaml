# render.yaml — Figureheadz deployment configuration
# https://render.com/docs/blueprint-spec
#
# Deploys two resources:
#   1. A single Web Service that builds the React frontend and serves it from
#      the Express API server (no separate static-site service required).
#   2. A managed Postgres database.
#
# First-time setup after connecting your repo on Render:
#   - Add the secret env vars listed below (CLERK_*, SESSION_SECRET,
#     ADMIN_PASSWORD, RESEND_API_KEY) via the Render dashboard
#     Environment → Secret Files / Environment Variables for the service.
#   - DATABASE_URL is injected automatically from the database below.

services:
  - type: web
    name: figureheadz
    runtime: node
    region: oregon
    plan: free

    # ── Build ────────────────────────────────────────────────────────────────
    # 1. Install pnpm (Render ships npm/yarn by default)
    # 2. Install all deps including devDependencies (needed for build tools)
    # 3. Build the React frontend (BASE_PATH=/ because the app lives at root)
    # 4. Compile the API server with esbuild
    # 5. Push the Drizzle schema to the database
    buildCommand: >
      npx --yes pnpm@10 install --no-frozen-lockfile &&
      BASE_PATH=/ PORT=3000 npx pnpm@10 --filter @workspace/figureheadz run build &&
      npx pnpm@10 --filter @workspace/api-server run build &&
      npx pnpm@10 --filter @workspace/db run push

    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs

    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically for web services — no need to set it here.
      # Secret env vars — fill these in via the Render dashboard:
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Injected automatically from the database below:
      - key: DATABASE_URL
        fromDatabase:
          name: figureheadz-db
          property: connectionString

databases:
  - name: figureheadz-db
    databaseName: figureheadz
    plan: free
    region: oregon
